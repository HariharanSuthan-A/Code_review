[project]
name = "code_review"
version = "0.1.0"
description = "code_review using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.28,<2.0.0",
    "tavily>=1.1.0",
]

[project.scripts]
code_review = "code_review.main:run"
run_crew = "code_review.main:run"
train = "code_review.main:train"
replay = "code_review.main:replay"
test = "code_review.main:test"
run_with_trigger = "code_review.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "be964760-8356-4537-b012-10bdeb3583be"
